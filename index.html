<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integra Cimentaciones — Resultados Comerciales Q3 2026</title>
<link rel="icon" href="logo-integra-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/chart.umd.js"></script>
<script src="assets/common.js"></script>
<script src="data/data.js"></script>
<style>
  :root {
    --navy:#0A1929; --navy-2:#1A2942; --gold:#F5A623; --gold-dark:#C8881A;
    --bg:#F4F5F7; --card:#FFFFFF; --text:#0F1419; --gray:#4A5560; --light-gray:#7A8694; --border:#DDE2E8;
    --success:#2D6A4F; --danger:#9B2C2C; --c-navy:#1F3A68; --c-proj:#B8C5D6; --c-gold:#C49B3A;
  }
  /* Retícula: lienzo lógico 1920×1080. 1rem = 10px lógicos, escalado al viewport sin deformar. */
  html { font-size: min(calc(100vw / 192), calc(100vh / 108)); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { height:100vh; overflow:hidden; background:var(--navy); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, sans-serif;
    display:flex; align-items:center; justify-content:center; }
  .stage { width:192rem; height:108rem; position:relative; overflow:hidden; background:var(--bg); }

  .slide { position:absolute; inset:0; display:none; grid-template-rows:15.6rem 1fr 6.4rem; padding:6.4rem 9.6rem 0; }
  .slide.active { display:grid; animation:fade .25s ease; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }

  .hd { position:relative; padding-left:2.4rem; border-left:.6rem solid var(--gold); align-self:start; }
  .eyebrow { font-size:1.8rem; font-weight:700; letter-spacing:.4rem; color:var(--gold-dark); text-transform:uppercase; }
  .title { font-size:5.4rem; font-weight:800; color:var(--navy); line-height:1.1; margin-top:.8rem; letter-spacing:-.05rem; }
  .sub { font-size:2.2rem; color:var(--gray); margin-top:1rem; }
  .chip { display:inline-block; margin-left:1.4rem; padding:.4rem 1.4rem; border-radius:1.4rem; background:var(--navy); color:#fff;
    font-size:1.4rem; font-weight:700; letter-spacing:.15rem; vertical-align:.3rem; }
  .chip.warn { background:var(--gold); color:var(--navy); }
  .corner { position:absolute; top:5.2rem; right:9.6rem; height:6.4rem; background:#fff; padding:.6rem 1rem; border-radius:1rem;
    box-shadow:0 .2rem .8rem rgba(10,25,41,.12); }

  .bd { min-height:0; padding:3.2rem 0 2.8rem; display:grid; gap:4.8rem; }
  .cols-kpi { grid-template-columns:52rem 1fr; }
  .cols-2 { grid-template-columns:1fr 1fr; }
  .cols-map { grid-template-columns:1fr 56rem; }
  .stack { display:flex; flex-direction:column; gap:2.4rem; min-height:0; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:1rem; padding:2.6rem 3.2rem; min-height:0; }
  .card.navy { background:var(--navy); border:none; }
  .card.grow { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .lbl { font-size:1.6rem; font-weight:700; letter-spacing:.2rem; color:var(--gray); text-transform:uppercase; }
  .val { font-size:9.2rem; font-weight:800; color:var(--navy); line-height:1; margin-top:1.2rem; letter-spacing:-.2rem; }
  .val.md { font-size:6rem; } .val.sm { font-size:4.4rem; letter-spacing:-.05rem; }
  .val.muted { color:var(--light-gray); }
  .note { font-size:1.9rem; color:var(--light-gray); margin-top:1rem; line-height:1.35; }
  .card.navy .lbl, .card.navy .val { color:var(--gold); }
  .card.navy .note { color:#fff; font-size:2.2rem; }
  .pos { color:var(--success) !important; } .neg { color:var(--danger) !important; }

  .chart-card { display:grid; grid-template-rows:auto 1fr auto; padding:2.8rem 3.6rem 2rem; }
  .ct { font-size:2rem; font-weight:700; color:var(--navy); }
  .legend { display:flex; flex-wrap:wrap; gap:2.8rem; font-size:1.7rem; color:var(--gray); margin-top:.8rem; }
  .legend i { display:inline-block; width:1.8rem; height:1.8rem; border-radius:.3rem; vertical-align:-.3rem; margin-right:.8rem; }
  .cw { position:relative; min-height:0; margin-top:1.2rem; }
  .foot-note { font-size:1.6rem; color:var(--light-gray); border-top:1px solid var(--border); padding-top:1.2rem; margin-top:.8rem; line-height:1.4; }
  .foot-note b { color:var(--navy); }

  .ft { display:flex; align-items:center; justify-content:space-between; border-top:.2rem solid var(--gold); background:#fff;
    margin:0 -9.6rem; padding:0 9.6rem; font-size:1.5rem; color:var(--light-gray); gap:2rem; }
  .ft .brand { font-weight:700; color:var(--navy); letter-spacing:.1rem; white-space:nowrap; }
  .ft .src { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav { display:flex; align-items:center; gap:1rem; white-space:nowrap; }
  .nav button { font:inherit; font-size:1.5rem; font-weight:700; color:var(--navy); background:var(--bg); border:1px solid var(--border);
    border-radius:.6rem; padding:.5rem 1.2rem; cursor:pointer; }
  .nav button:hover { background:var(--gold); border-color:var(--gold); }
  .nav .count { min-width:6rem; text-align:right; }

  /* KPI grid de resumen */
  .kpi4 { display:grid; grid-template-columns:repeat(4, 1fr); gap:2.4rem; }
  .kpi4 .card { padding:3rem 3rem 2.8rem; }
  .kpi4 .val { font-size:8rem; }

  /* Tablas */
  table.t { width:100%; border-collapse:collapse; font-size:1.8rem; font-variant-numeric:tabular-nums; }
  table.t th { text-align:left; font-size:1.4rem; letter-spacing:.1rem; text-transform:uppercase; color:var(--gray);
    border-bottom:.2rem solid var(--navy); padding:1rem 1.2rem; white-space:nowrap; }
  table.t td { padding:1.05rem 1.2rem; border-bottom:1px solid var(--border); }
  table.t .r { text-align:right; }
  table.t tbody tr:nth-child(even) td { background:#FAFBFC; }
  table.t th.sortable { cursor:pointer; } table.t th.sortable:hover { color:var(--navy); }

  /* Selector de escenarios */
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:.8rem; overflow:hidden; margin-top:1.2rem; }
  .seg button { font:inherit; font-size:1.7rem; font-weight:700; padding:.8rem 2rem; border:none; background:#fff; color:var(--gray); cursor:pointer; }
  .seg button.on { background:var(--navy); color:var(--gold); }

  /* Portada */
  #s-portada { background:var(--navy); display:none; place-items:center; padding:0; grid-template-rows:1fr; }
  #s-portada.active { display:grid; }
  .cover { text-align:center; color:#fff; }
  .cover img { width:52rem; background:#fff; padding:2.4rem 3.2rem; border-radius:1.6rem; box-shadow:0 .4rem 1.6rem rgba(0,0,0,.3); }
  .cover .k { font-size:2rem; letter-spacing:.8rem; color:var(--gold); font-weight:700; margin-top:6rem; }
  .cover h1 { font-size:8.8rem; font-weight:800; margin-top:1.6rem; letter-spacing:-.1rem; }
  .cover .s { font-size:2.8rem; color:#B8C5D6; margin-top:1.6rem; }
  .cover .line { width:12rem; height:.6rem; background:var(--gold); margin:4rem auto 0; }
  .cover .d { font-size:2rem; color:#B8C5D6; margin-top:3rem; }
  .cover-hint { position:absolute; bottom:3.2rem; right:4rem; font-size:1.5rem; color:#7A8694; }

  /* Funnel HTML */
  .funnel { display:flex; flex-direction:column; gap:2.6rem; margin-top:2.6rem; }
  .fstep { display:flex; align-items:center; gap:2rem; }
  .fbar { height:8.8rem; border-radius:.8rem; background:var(--c-navy); color:#fff; display:flex; align-items:center; padding:0 2.4rem;
    font-size:3.6rem; font-weight:800; white-space:nowrap; }
  .fstep .fl { font-size:1.9rem; color:var(--gray); line-height:1.3; }
  .fstep .fl b { color:var(--navy); font-size:2.1rem; display:block; }
  .layers { display:flex; height:11rem; border-radius:1rem; overflow:hidden; margin-top:1.6rem; }
  .layers div { display:flex; flex-direction:column; justify-content:center; padding:0 2.4rem; color:#fff; font-size:1.8rem; line-height:1.3; }
  .layers b { font-size:3.6rem; font-weight:800; }

  /* Equipo */
  .person { display:flex; gap:2.4rem; align-items:center; }
  .avatar { width:12rem; height:12rem; border-radius:50%; background:var(--gold); color:var(--navy); display:grid; place-items:center;
    font-size:4.4rem; font-weight:800; flex:none; }
  .tags { display:flex; gap:1rem; flex-wrap:wrap; margin-top:1.6rem; }
  .tags span { background:var(--bg); border:1px solid var(--border); border-radius:2rem; padding:.6rem 1.6rem; font-size:1.7rem; font-weight:600; color:var(--navy); }

  /* Mapa */
  #map { width:100%; height:100%; border-radius:1rem; border:1px solid var(--border); }
  .leaflet-tooltip { font-size:1.6rem; line-height:1.35; }
  .bars-h { display:flex; flex-direction:column; gap:1.3rem; margin-top:1.6rem; }
  .bh { display:grid; grid-template-columns:20rem 1fr 11rem; align-items:center; gap:1.2rem; font-size:1.8rem; }
  .bh .track { height:2.2rem; background:var(--bg); border-radius:.4rem; overflow:hidden; }
  .bh .fill { height:100%; background:var(--c-navy); }
  .bh .v { text-align:right; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; }

  /* Explorador */
  .filters { display:flex; flex-wrap:wrap; gap:1.2rem 2rem; align-items:center; }
  .filters label { font-size:1.4rem; font-weight:700; letter-spacing:.1rem; text-transform:uppercase; color:var(--gray); }
  .filters select { font:inherit; font-size:1.6rem; padding:.6rem 1rem; border:1px solid var(--border); border-radius:.6rem; margin-left:.6rem; background:#fff; max-width:26rem; }
  .filters button { font:inherit; font-size:1.6rem; padding:.6rem 1.4rem; border:1px solid var(--navy); border-radius:.6rem; background:#fff; color:var(--navy); cursor:pointer; font-weight:700; }
  .exp-kpis { display:grid; grid-template-columns:repeat(4, 1fr); gap:2rem; }
  .exp-kpis .card { padding:1.8rem 2.4rem; } .exp-kpis .val { font-size:4.4rem; margin-top:.6rem; }
  .scroll { overflow:auto; min-height:0; }
  .scroll table.t { font-size:1.6rem; } .scroll table.t td { padding:.8rem 1rem; } .scroll thead th { position:sticky; top:0; background:#fff; }

  /* Índice */
  .toc { position:absolute; inset:0; background:rgba(10,25,41,.92); display:none; z-index:1000; padding:8rem 9.6rem; }
  .toc.open { display:block; }
  .toc h2 { color:var(--gold); font-size:2rem; letter-spacing:.4rem; margin-bottom:3rem; }
  .toc ol { columns:2; column-gap:6rem; list-style:none; }
  .toc li { font-size:2.6rem; padding:1.2rem 0; border-bottom:1px solid rgba(255,255,255,.1); break-inside:avoid; }
  .toc a { color:#fff; text-decoration:none; } .toc a:hover { color:var(--gold); }
  .toc .n { color:var(--gold); font-weight:800; display:inline-block; width:5rem; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="slide" id="s-portada" data-t="Portada">
    <div class="cover">
      <img src="logo-integra.png" alt="Integra Cimentaciones">
      <div class="k">ÁREA COMERCIAL · PRESENTACIÓN PARA INVERSIONISTAS</div>
      <h1>Resultados comerciales Q3 2026</h1>
      <div class="s">Julio – septiembre 2026</div>
      <div class="line"></div>
      <div class="d">Octubre 2026</div>
    </div>
    <div class="cover-hint">→ para avanzar · Esc para el índice</div>
  </section>
  <section class="slide" id="s-resumen" data-t="Resumen ejecutivo"></section>
  <section class="slide" id="s-proyeccion" data-t="Proyección vs real"></section>
  <section class="slide" id="s-forecast" data-t="Forecast Q4 2026"></section>
  <section class="slide" id="s-anual" data-t="Año contra año"></section>
  <section class="slide" id="s-relacion" data-t="Relación con clientes"></section>
  <section class="slide" id="s-clientes" data-t="Clientes"></section>
  <section class="slide" id="s-mezcla" data-t="Servicios y canales"></section>
  <section class="slide" id="s-geografia" data-t="Geografía"></section>
  <section class="slide" id="s-demanda" data-t="Generación de demanda"></section>
  <section class="slide" id="s-funnel" data-t="Del lead a la venta"></section>
  <section class="slide" id="s-capacidad" data-t="Capacidad comercial"></section>
  <section class="slide" id="s-explorador" data-t="Explorador de ventas"></section>
  <section class="slide" id="s-cierre" data-t="Cierre"></section>
  <div class="toc" id="toc"><h2>ÍNDICE</h2><ol id="toc-list"></ol></div>
</div>

<script>
const D = window.DATA, M = D.metrics;
const $ = s => document.querySelector(s);
const slides = [...document.querySelectorAll('.slide')];
const N = slides.length;
const charts = {};
let current = 0, map = null;

// ---------- Plantillas comunes ----------
function frame(id, { eyebrow, title, sub, chip, chipWarn, body, src }) {
  const i = slides.findIndex(s => s.id === id);
  $('#' + id).innerHTML = `
    <header class="hd">
      <div class="eyebrow">${String(i).padStart(2, '0')} · ${eyebrow}</div>
      <h1 class="title">${title}</h1>
      <div class="sub">${sub}${chip ? `<span class="chip${chipWarn ? ' warn' : ''}">${chip}</span>` : ''}</div>
    </header>
    <img class="corner" src="logo-integra-icon.png" alt="Integra">
    <main class="bd ${body.cls || ''}">${body.html}</main>
    <footer class="ft">
      <span class="src">Fuente: ${src}</span>
      <span class="brand">INTEGRA CIMENTACIONES</span>
      <span class="nav"><button onclick="go(current-1)" aria-label="Anterior">←</button>
        <button onclick="toggleToc()">Índice</button>
        <button onclick="go(current+1)" aria-label="Siguiente">→</button>
        <span class="count">${i} / ${N - 1}</span></span>
    </footer>`;
}
const kpi = (lbl, val, note, cls = '') => `<div class="card ${cls}"><div class="lbl">${lbl}</div><div class="val">${val}</div>${note ? `<div class="note">${note}</div>` : ''}</div>`;
const SRC_XLS = 'Excel de ventas (corte 30-sep-2026)';
const SRC_GHL = `Google Ads: Master Metrics de SRM · corte ${F.fecha(D.ghl.mm.corte)} · oportunidades: API Go High Level`;

// ---------- Escala de gráficas al lienzo ----------
const u = () => parseFloat(getComputedStyle(document.documentElement).fontSize) / 10; // px reales por px lógico
const fs = n => Math.round(n * u() * 10) / 10;
function baseOpts(extra = {}) {
  return Object.assign({
    responsive: true, maintainAspectRatio: false, animation: false,
    plugins: { legend: { display: false }, tooltip: { titleFont: { size: fs(16) }, bodyFont: { size: fs(16) }, padding: fs(10) } },
  }, extra);
}
const axisM = (max, step) => ({ min: 0, max, ticks: { stepSize: step, font: { size: fs(17) }, color: P.muted, callback: v => v === 0 ? '$0' : F.M(v) },
  grid: { color: P.grid }, border: { display: false } });
const axisX = (size = 20) => ({ ticks: { font: { size: fs(size), weight: '600' }, color: P.ink }, grid: { display: false } });
const valueLabels = (fmt, color = P.ink, size = 18, datasets = null) => ({
  id: 'vl', afterDatasetsDraw(c) {
    const { ctx } = c; ctx.save(); ctx.font = `700 ${fs(size)}px -apple-system, Segoe UI, sans-serif`; ctx.textAlign = 'center';
    c.data.datasets.forEach((ds, di) => {
      if (datasets && !datasets.includes(di)) return;
      c.getDatasetMeta(di).data.forEach((el, i) => {
        const v = ds.data[i]; if (v == null) return;
        const t = fmt(v, i, di); if (!t) return;
        ctx.fillStyle = typeof color === 'function' ? color(v, i, di) : color;
        ctx.fillText(t, el.x, el.y - fs(10));
      });
    });
    ctx.restore();
  }
});
function mk(id, cfg) { if (charts[id]) charts[id].destroy(); charts[id] = new Chart(document.getElementById(id), cfg); }

// ---------- 02 Resumen ----------
frame('s-resumen', {
  eyebrow: 'Resumen ejecutivo', title: `El mejor trimestre del registro: ${F.M(M.q3_26.monto)}`,
  sub: 'Las cuatro cifras que resumen el trimestre', chip: 'Q3 2026 · JUL–SEP',
  src: SRC_XLS + ' · forecast publicado jul-2026',
  body: { cls: '', html: `
    <div class="stack">
      <div class="kpi4">
        ${kpi('Vendido en Q3', F.M(M.q3_26.monto), `${M.q3_26.ventas} ventas · ticket ${F.K(M.q3_26.ticket)}`, 'navy')}
        ${kpi('vs proyección optimista', F.signPct(D.proyeccion.pct_opt), `${F.signShort(D.proyeccion.dif_opt)} sobre lo proyectado en julio`)}
        ${kpi('vs Q3 2025', F.signPct(M.yoy_monto, 0), `${F.x(M.multiplo_monto)} el monto · ${F.M(M.q3_25.monto)} → ${F.M(M.q3_26.monto)}`)}
        ${kpi('Recompra o recomendación', F.pct0(M.rel_q3_26.pct_ventas), `${M.rel_q3_26.ventas} de ${M.q3_26.ventas} ventas · ${F.pct0(M.rel_q3_26.pct_monto)} del monto`)}
      </div>
      <div class="card chart-card" style="flex:1">
        <div><div class="ct">Monto vendido por trimestre</div></div>
        <div class="cw"><canvas id="cQuarters"></canvas></div>
        <div class="foot-note">El registro inicia en jun-2025; junio 2025 (un solo mes de Q2) no se grafica.</div>
      </div>
    </div>` }
});
function drawResumen() {
  const q = M.trimestres;
  mk('cQuarters', { type: 'bar', data: { labels: q.map(x => x.label),
      datasets: [{ data: q.map(x => x.monto), backgroundColor: q.map((x, i) => i === q.length - 1 ? P.goldBright : P.navy), borderRadius: fs(6), barPercentage: .6 }] },
    options: baseOpts({ layout: { padding: { top: fs(34) } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${F.mxn(c.raw)} · ${q[c.dataIndex].ventas} ventas` } } },
      scales: { y: { display: false, min: 0 }, x: axisX(19) } }),
    plugins: [valueLabels(v => F.M(v), P.ink, 19)] });
}

// ---------- 03 Proyección vs real ----------
const PR = D.proyeccion;
frame('s-proyeccion', {
  eyebrow: 'Proyección vs real', title: 'Superamos incluso el escenario optimista',
  sub: 'Lo proyectado en julio contra lo vendido en el trimestre', chip: 'Q3 2026 · JUL–SEP',
  src: SRC_XLS + ' · forecast publicado jul-2026',
  body: { cls: 'cols-kpi', html: `
    <div class="stack">
      ${kpi('Vendido Q3 2026', F.M(PR.real), `${M.q3_26.ventas} ventas · ${PR.meses.filter(m => m.real > m.optimista).length} de 3 meses arriba de lo proyectado`)}
      <div class="card"><div class="lbl">Proyección optimista</div><div class="val md muted">${F.M(PR.optimista)}</div><div class="note">Forecast publicado en julio 2026</div></div>
      <div class="card navy grow"><div class="lbl">Por encima de lo proyectado</div><div class="val" style="font-size:10.4rem">${F.signShort(PR.dif_opt)}</div>
        <div class="note">${F.signPct(PR.pct_opt)} sobre la proyección optimista</div></div>
    </div>
    <div class="card chart-card">
      <div><div class="ct">Proyección optimista vs vendido, por mes</div>
        <div class="legend"><span><i style="background:${P.proj}"></i>Proyección optimista</span><span><i style="background:${P.navy}"></i>Vendido real</span>
        <span class="pos" style="font-weight:700">+$ diferencia vs proyección</span></div></div>
      <div class="cw"><canvas id="cProy"></canvas></div>
      <div class="foot-note">Escenario base del mismo forecast: <b>${F.M(PR.base)}</b> → el real lo supera por <b>${F.signShort(PR.dif_base)} (${F.signPct(PR.pct_base)})</b>.</div>
    </div>` }
});
function drawProyeccion() {
  mk('cProy', { type: 'bar', data: { labels: PR.meses.map(m => F.mesLargo(m.ym)), datasets: [
      { label: 'Proyección optimista', data: PR.meses.map(m => m.optimista), backgroundColor: P.proj, borderRadius: fs(6), barPercentage: .82, categoryPercentage: .62 },
      { label: 'Vendido real', data: PR.meses.map(m => m.real), backgroundColor: P.navy, borderRadius: fs(6), barPercentage: .82, categoryPercentage: .62 }] },
    options: baseOpts({ layout: { padding: { top: fs(36) } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${F.mxn(c.raw)}` } } },
      scales: { y: axisM(2e6, 5e5), x: axisX(22) } }),
    plugins: [valueLabels((v, i) => F.signShort(PR.meses[i].real - PR.meses[i].optimista), (v, i) => PR.meses[i].real >= PR.meses[i].optimista ? P.success : P.danger, 22, [1])] });
}

// ---------- 04 Forecast Q4 ----------
const FC = D.forecast;
let esc = 'base';
const s26 = D.serie.filter(p => p.ym.startsWith('2026'));
frame('s-forecast', {
  eyebrow: 'Forecast Q4 2026', title: `La tendencia de 2026 apunta a ${F.M(FC.q4.base)} en Q4`,
  sub: 'Proyección con la tendencia de ene–sep 2026 · elige el escenario', chip: 'OCT–DIC 2026',
  src: SRC_XLS + ' · regresión lineal ene–sep 2026',
  body: { cls: 'cols-kpi', html: `
    <div class="stack">

    </div>` }
});
function drawGeografia() {
  if (typeof L === 'undefined') { $('#map').innerHTML = '<div style="padding:4rem;font-size:2rem;color:#7A8694">El mapa necesita conexión a internet.</div>'; return; }
  if (!map) {
    map = L.map('map', { zoomControl: true, scrollWheelZoom: false, attributionControl: true, zoomSnap: .25 });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '© OpenStreetMap', maxZoom: 12 }).addTo(map);
    map._layer = L.layerGroup().addTo(map);
  }
  map.invalidateSize();
  // Encuadre en el territorio continental donde se concentra la operación (Mexicali queda fuera del encuadre inicial)
  map.fitBounds(GM.filter(m => m.lon > -110).map(m => [m.lat, m.lon]), { padding: [24 * u(), 24 * u()] });
  const g = map._layer; g.clearLayers();
  const maxM = Math.max(...GM.map(m => Math.max(m.monto_2025, m.monto_2026)));
  const rad = v => Math.max(4, Math.sqrt(v / maxM) * 42) * u();
  const tip = m => `<b>${m.municipio}, ${m.estado}</b>${m.localidades.length ? `<br><span style="color:#7A8694">${m.localidades.join(', ')}</span>` : ''}
    <br>2025: ${F.mxn(m.monto_2025)}<br>2026: ${F.mxn(m.monto_2026)}<br>Ventas: ${F.n1(m.ventas)}`;
  ['2025', '2026'].forEach(y => {
    if (geoYear !== 'ambos' && geoYear !== y) return;
    [...GM].sort((a, b) => b['monto_' + y] - a['monto_' + y]).forEach(m => {
      if (!m['monto_' + y]) return;
      L.circleMarker([m.lat, m.lon], { radius: rad(m['monto_' + y]), color: '#fff', weight: 1, fillColor: y === '2025' ? P.y2025 : P.y2026,
        fillOpacity: y === '2025' ? .75 : .65 }).bindTooltip(tip(m)).addTo(g);
    });
  });
}
document.addEventListener('click', ev => { const b = ev.target.closest('#segGeo button'); if (!b) return;
  geoYear = b.dataset.y; document.querySelectorAll('#segGeo button').forEach(x => x.classList.toggle('on', x === b)); drawGeografia(); });

// ---------- 12 Capacidad comercial ----------
const EQ = D.equipo.asistente, AC = D.clientify.actividades_2026_h1;
const capMeses = ['2026-08', '2026-09', '2026-10'];
const capLbl = m => m === '2026-10' ? `Oct (al ${+API.corte.slice(8)})` : F.mesLargo(m);
const capSeries = [['whatsapp_salientes', 'WhatsApp enviados'], ['llamadas_salientes', 'Llamadas realizadas'], ['email_salientes', 'Correos enviados']];
const AQ = capMeses.slice(0, 2).map(m => API.actividades[m]);
const salQ3 = AQ.reduce((a, x) => a + x.whatsapp_salientes + x.llamadas_salientes + x.email_salientes, 0) / AQ.length;
frame('s-capacidad', {
  eyebrow: 'Capacidad comercial', title: `Más estructura: de ${F.n1(M.ventas_mes_h1_26)} a ${F.n1(M.ventas_mes_q3)} ventas por mes`,
  sub: 'Equipo y actividad comercial registrada en Go High Level', chip: 'AGO–OCT 2026',
  src: `API Go High Level (${F.fecha(API.corte)}) · ` + SRC_XLS,
  body: { cls: 'cols-kpi', html: `
    <div class="stack">
      <div class="card"><div class="lbl">Nueva integrante del equipo</div>

          <div><div style="font-size:3.4rem;font-weight:800;color:var(--navy)">${EQ.nombre}</div><div style="font-size:2rem;color:var(--gray)">${EQ.puesto}</div><div style="font-size:1.8rem;color:var(--light-gray)">Desde el 17 de agosto de 2026</div></div></div>
        <div class="tags">${EQ.funciones.map(f => `<span>${f}</span>`).join('')}</div></div>

        <div class="note">ventas por mes en Q3, contra ${F.n1(M.ventas_mes_h1_26)} en el 1er semestre · pico de ${M.ventas_mes_max_2026} en agosto</div></div>

        <div class="note">mensajes, llamadas y correos enviados · ${F.int((AQ[0].tareas_completadas + AQ[1].tareas_completadas) / 2)} tareas de seguimiento completadas al mes</div></div>

      <div><div class="ct">Interacciones enviadas por mes (barras) y tareas completadas (línea)</div>

    </div>` }
});
function drawCapacidad() {
  const ds = capSeries.map(([k, l], i) => ({ type: 'bar', label: l, data: capMeses.map(m => API.actividades[m][k]), backgroundColor: P.seq[i], stack: 'a', yAxisID: 'y', barPercentage: .55, order: 2 }));

  mk('cCap', { data: { labels: capMeses.map(capLbl), datasets: ds },
    options: baseOpts({ layout: { padding: { top: fs(30) } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${F.int(c.raw)}` } } },
      scales: { y: { stacked: true, min: 0, max: 2000, ticks: { font: { size: fs(16) }, color: P.muted, callback: v => F.int(v) }, grid: { color: P.grid }, border: { display: false } },
                x: { stacked: true, ...axisX(21) } } }),

// ---------- 13 Explorador ----------
const R = D.rows;
const EXF = [['year', 'Año'], ['month', 'Mes'], ['estado', 'Estado'], ['servicio', 'Servicio'], ['canal', 'Canal'], ['tipo', 'Tipo']];
let exSort = { k: 'fecha_cierre', dir: -1 };
frame('s-explorador', {
  eyebrow: 'Explorador de ventas', title: `Las ${R.length} ventas, una por una`,
  sub: 'Filtra y ordena; los indicadores se recalculan con el filtro', chip: 'JUN-2025 – SEP-2026',
  src: SRC_XLS + ' · datos normalizados',
  body: { cls: '', html: `
    <div class="stack" style="min-height:0">
      <div class="filters" id="exF">${EXF.map(([k, l]) => `<label>${l}<select data-k="${k}"><option value="">Todos</option>${[...new Set(R.flatMap(r => k === 'estado' ? r.estado.split(' / ') : [r[k]]))].sort((a, b) => a > b ? 1 : -1)
          .map(v => `<option value="${v}">${k === 'month' ? F.mesLargo('2026-' + String(v).padStart(2, '0')) : v}</option>`).join('')}</select></label>`).join('')}
        <button id="exClear">Limpiar filtros</button></div>
      <div class="exp-kpis" id="exK"></div>
      <div class="card scroll" style="flex:1;padding:0 1.6rem"><table class="t" id="exT"></table></div>
    </div>` }
});
const EXC = [['fecha_cierre', 'Cierre'], ['cliente', 'Cliente'], ['municipio', 'Municipio'], ['estado', 'Estado'], ['servicio', 'Servicio'], ['canal', 'Canal'], ['costo', 'Monto', 'r'], ['dias', 'Días', 'r']];
function drawExplorador() {
  const f = {}; document.querySelectorAll('#exF select').forEach(s => { if (s.value) f[s.dataset.k] = s.value; });
  const rows = R.filter(r => Object.entries(f).every(([k, v]) => k === 'estado' ? r.estado.split(' / ').includes(v) : String(r[k]) === v))
    .sort((a, b) => { const x = a[exSort.k] ?? '', y = b[exSort.k] ?? ''; return (x > y ? 1 : x < y ? -1 : 0) * exSort.dir; });
  const m = rows.reduce((a, r) => a + r.costo, 0), d = rows.filter(r => r.dias != null);
  $('#exK').innerHTML = kpi('Ventas', rows.length) + kpi('Monto', F.M(m)) + kpi('Ticket promedio', rows.length ? F.K(m / rows.length) : '—') +
    kpi('Ciclo promedio', d.length ? F.n1(d.reduce((a, r) => a + r.dias, 0) / d.length) + ' días' : '—');
  $('#exT').innerHTML = `<thead><tr>${EXC.map(([k, l, c]) => `<th class="sortable ${c || ''}" data-k="${k}">${l}${exSort.k === k ? (exSort.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${EXC.map(([k, , c]) => `<td class="${c || ''}">${k === 'costo' ? F.mxn(r.costo) : k === 'fecha_cierre' ? F.fecha(r.fecha_cierre) : (r[k] ?? '—')}</td>`).join('')}</tr>`).join('')}</tbody>`;
}
document.addEventListener('change', ev => { if (ev.target.closest('#exF')) drawExplorador(); });
document.addEventListener('click', ev => {
  const th = ev.target.closest('#exT th.sortable');
  if (th) { exSort = { k: th.dataset.k, dir: exSort.k === th.dataset.k ? -exSort.dir : (th.dataset.k === 'costo' ? -1 : 1) }; drawExplorador(); }
  if (ev.target.id === 'exClear') { document.querySelectorAll('#exF select').forEach(s => s.value = ''); drawExplorador(); }
});

      <div class="card navy"><div class="lbl">Lo que sigue · Q4 2026</div><div class="val md">${F.M(FC.q4.base)}</div>
        <div class="note" style="font-size:2.5rem;line-height:1.7;margin-top:2.4rem">Escenario base con la tendencia de 2026 (rango ${F.M(FC.q4.pesimista)} – ${F.M(FC.q4.optimista)}), con el equipo completo y GHL al 100%.</div></div>
    </div>
    </div><div class="card" style="border-left:.6rem solid var(--gold);padding:3.6rem 4rem"><div style="font-size:3.2rem;font-weight:700;color:var(--navy);line-height:1.35">
      Q3 2026 fue el mejor trimestre del registro: superamos la meta más ambiciosa y la relación con nuestros clientes ya genera la mayoría de las ventas.</div></div></div>` }
});

// ---------- Navegación ----------
const DRAW = { 's-resumen': drawResumen, 's-proyeccion': drawProyeccion, 's-forecast': drawForecast, 's-anual': drawAnual, 's-relacion': drawRelacion,
  's-clientes': drawClientes, 's-mezcla': drawMezcla, 's-geografia': drawGeografia, 's-demanda': drawDemanda, 's-capacidad': drawCapacidad, 's-explorador': drawExplorador };
$('#toc-list').innerHTML = slides.map((s, i) => `<li><a href="#${s.id.slice(2)}"><span class="n">${String(i).padStart(2, '0')}</span>${s.dataset.t}</a></li>`).join('');
function go(i, push = true) {
  i = Math.max(0, Math.min(N - 1, i));
  slides[current].classList.remove('active'); current = i; slides[i].classList.add('active');
  $('#toc').classList.remove('open');
  if (push) history.replaceState(null, '', '#' + slides[i].id.slice(2));
  requestAnimationFrame(() => DRAW[slides[i].id] && DRAW[slides[i].id]());
}
function toggleToc() { $('#toc').classList.toggle('open'); }
function fromHash() { const i = slides.findIndex(s => s.id === 's-' + location.hash.slice(1)); return i < 0 ? 0 : i; }
addEventListener('hashchange', () => go(fromHash(), false));
addEventListener('keydown', e => {
  if (e.target.closest('select')) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(current + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(current - 1); }
  if (e.key === 'Home') go(0); if (e.key === 'End') go(N - 1);
  if (e.key === 'Escape') toggleToc();
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => go(current, false), 150); });
Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, sans-serif';
slides[0].classList.add('active'); go(fromHash(), false);
// Auditoría: cada cifra sale de DATA.metrics (ver data/build.py)
console.table && console.table(Object.fromEntries(Object.entries(M).filter(([, v]) => typeof v !== 'object')));
</script>
